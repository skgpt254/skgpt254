name: Generate Banner

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/scripts/generate_banner.py"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate banner.svg
        run: python3 .github/scripts/generate_banner.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.svg banner-dark.svg
          git diff --staged --quiet || git commit -m "Update banner [skip ci]"
          git push
